services:
  # Backend Service
  - type: web
    name: waste-simulator-backend
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # Frontend Service
  - type: web
    name: waste-simulator-frontend
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://waste-simulator-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://waste-simulator-backend.onrender.com